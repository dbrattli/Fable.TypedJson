# yaml-language-server: $schema=https://raw.githubusercontent.com/CodSpeedHQ/codspeed/refs/heads/main/schemas/codspeed.schema.json
# decision: uses fixed batches instead of timed loops so regressions cannot reduce the amount of work
# tradeoff: measures command startup and warmup as well as the batch; counts amortize their cost
options:
  warmup-time: 1s
  min-rounds: 3
  max-rounds: 3

benchmarks:
  - name: dotnet/decode-record/600000-ops
    exec: bash benchmarks/cli/run.sh dotnet decode-record 600000
  - name: dotnet/parse-decode-record/200000-ops
    exec: bash benchmarks/cli/run.sh dotnet parse-decode-record 200000
  - name: dotnet/encode-record/500000-ops
    exec: bash benchmarks/cli/run.sh dotnet encode-record 500000
  - name: dotnet/strict-int/2000000-ops
    exec: bash benchmarks/cli/run.sh dotnet strict-int 2000000
  - name: dotnet/strict-int64-small/2000000-ops
    exec: bash benchmarks/cli/run.sh dotnet strict-int64-small 2000000
  - name: dotnet/strict-int64-wide/2000000-ops
    exec: bash benchmarks/cli/run.sh dotnet strict-int64-wide 2000000
  - name: dotnet/strict-int-reject/500000-ops
    exec: bash benchmarks/cli/run.sh dotnet strict-int-reject 500000
  - name: js/decode-record/1000000-ops
    exec: bash benchmarks/cli/run.sh js decode-record 1000000
  - name: js/parse-decode-record/500000-ops
    exec: bash benchmarks/cli/run.sh js parse-decode-record 500000
  - name: js/encode-record/1000000-ops
    exec: bash benchmarks/cli/run.sh js encode-record 1000000
  - name: js/strict-int/2000000-ops
    exec: bash benchmarks/cli/run.sh js strict-int 2000000
  - name: js/strict-int64-small/2000000-ops
    exec: bash benchmarks/cli/run.sh js strict-int64-small 2000000
  - name: js/strict-int64-wide/800000-ops
    exec: bash benchmarks/cli/run.sh js strict-int64-wide 800000
  - name: js/strict-int-reject/200000-ops
    exec: bash benchmarks/cli/run.sh js strict-int-reject 200000
  - name: python/decode-record/50000-ops
    exec: bash benchmarks/cli/run.sh python decode-record 50000
  - name: python/parse-decode-record/30000-ops
    exec: bash benchmarks/cli/run.sh python parse-decode-record 30000
  - name: python/encode-record/50000-ops
    exec: bash benchmarks/cli/run.sh python encode-record 50000
  - name: python/strict-int/50000-ops
    exec: bash benchmarks/cli/run.sh python strict-int 50000
  - name: python/strict-int64-small/50000-ops
    exec: bash benchmarks/cli/run.sh python strict-int64-small 50000
  - name: python/strict-int64-wide/50000-ops
    exec: bash benchmarks/cli/run.sh python strict-int64-wide 50000
  - name: python/strict-int-reject/10000-ops
    exec: bash benchmarks/cli/run.sh python strict-int-reject 10000
  - name: beam/decode-record/100000-ops
    exec: bash benchmarks/cli/run.sh beam decode-record 100000
  - name: beam/parse-decode-record/50000-ops
    exec: bash benchmarks/cli/run.sh beam parse-decode-record 50000
  - name: beam/encode-record/100000-ops
    exec: bash benchmarks/cli/run.sh beam encode-record 100000
  - name: beam/strict-int/200000-ops
    exec: bash benchmarks/cli/run.sh beam strict-int 200000
  - name: beam/strict-int64-small/200000-ops
    exec: bash benchmarks/cli/run.sh beam strict-int64-small 200000
  - name: beam/strict-int64-wide/200000-ops
    exec: bash benchmarks/cli/run.sh beam strict-int64-wide 200000
  - name: beam/strict-int-reject/50000-ops
    exec: bash benchmarks/cli/run.sh beam strict-int-reject 50000
