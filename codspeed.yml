# yaml-language-server: $schema=https://raw.githubusercontent.com/CodSpeedHQ/codspeed/refs/heads/main/schemas/codspeed.schema.json
# decision: uses fixed batches instead of timed loops so regressions cannot reduce the amount of work
# tradeoff: measures command startup and warmup as well as the batch; counts amortize their cost
options:
  warmup-time: 1s
  min-rounds: 3
  max-rounds: 3

benchmarks:
  - name: dotnet/decode-record/600000-ops
    exec: bash benchmarks/cli/run.sh dotnet decode-record 600000
  - name: dotnet/parse-decode-record/200000-ops
    exec: bash benchmarks/cli/run.sh dotnet parse-decode-record 200000
  - name: dotnet/encode-record/500000-ops
    exec: bash benchmarks/cli/run.sh dotnet encode-record 500000
