name: CodSpeed

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      target:
        description: Runtime to build and measure
        type: choice
        default: all
        options: [all, dotnet, js, python, beam]
      suite:
        description: Core, sequences, repeatability probes, or every workload
        type: choice
        default: core
        options: [core, sequences, repeatability, full]
      profile:
        description: Quick, confirm, or warmed JS throughput (target js, suite repeatability)
        type: choice
        default: quick
        options: [quick, confirm, throughput]

env:
  BENCH_TARGET: ${{ inputs.target || 'all' }}
  BENCH_SUITE: ${{ inputs.suite || 'core' }}
  BENCH_PROFILE: ${{ inputs.profile || 'quick' }}

permissions:
  contents: read

concurrency:
  group: codspeed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # decision: makes PR benchmarks opt-in while retaining main runs for the performance baseline
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'perf')
    # decision: compiles on GitHub ARM64 Ubuntu 22.04 to save macro minutes and match the measurement platform
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x
          cache: true
          cache-dependency-path: paket.lock

      - name: Setup Erlang/OTP
        if: env.BENCH_TARGET == 'all' || env.BENCH_TARGET == 'beam'
        uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          rebar3-version: '3'

      - name: Setup uv
        if: env.BENCH_TARGET == 'all' || env.BENCH_TARGET == 'python'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Setup Python
        if: env.BENCH_TARGET == 'all' || env.BENCH_TARGET == 'python'
        run: uv python install 3.12

      - name: Setup Node.js
        if: env.BENCH_TARGET == 'all' || env.BENCH_TARGET == 'js'
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Restore dependencies
        run: |
          just restore-net
          if [ "$BENCH_TARGET" = all ] || [ "$BENCH_TARGET" = python ]; then
            uv sync --frozen --python 3.12
          fi

      - name: Select measurement workloads
        # decision: validates selection before building and keeps the chosen config in the runner artifact
        run: python3 benchmarks/cli/select-codspeed.py --target "$BENCH_TARGET" --suite "$BENCH_SUITE" --profile "$BENCH_PROFILE" --output build/codspeed/selected.yml

      - name: Build benchmark runners
        run: |
          if [ "$BENCH_PROFILE" = throughput ]; then
            just build-bench-throughput-js
          elif [ "$BENCH_TARGET" = all ]; then
            just build-bench-cli
          else
            just "build-bench-cli-$BENCH_TARGET"
          fi

      - name: Check benchmark results
        run: |
          if [ "$BENCH_PROFILE" = throughput ]; then
            node build/codspeed/js-throughput/bench.mjs --smoke
          elif [ "$BENCH_TARGET" = all ]; then
            just bench-cli-smoke
          else
            bash benchmarks/cli/run.sh "$BENCH_TARGET" --smoke
          fi

      # decision: transfers a tar archive to preserve BEAM symbolic links between runners
      - name: Package benchmark runners
        run: tar -czf benchmark-runners.tar.gz build/codspeed

      - name: Upload benchmark runners
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-runners
          path: benchmark-runners.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  benchmarks:
    needs: build
    permissions:
      contents: read
      id-token: write
    # decision: uses a fixed Graviton macro runner to reduce host variance in walltime measurements
    runs-on: codspeed-macro-arm64-graviton-ubuntu-22-04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET runtime
        if: env.BENCH_TARGET == 'all' || env.BENCH_TARGET == 'dotnet'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Setup Erlang/OTP
        if: env.BENCH_TARGET == 'all' || env.BENCH_TARGET == 'beam'
        uses: erlef/setup-beam@v1
        with:
          otp-version: '27'

      - name: Setup uv
        if: env.BENCH_TARGET == 'all' || env.BENCH_TARGET == 'python'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Setup Python runtime dependencies
        if: env.BENCH_TARGET == 'all' || env.BENCH_TARGET == 'python'
        run: uv sync --frozen --python 3.12

      - name: Setup Node.js
        if: env.BENCH_TARGET == 'all' || env.BENCH_TARGET == 'js'
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Download benchmark runners
        uses: actions/download-artifact@v8
        with:
          name: benchmark-runners

      - name: Unpack benchmark runners
        run: |
          tar -xzf benchmark-runners.tar.gz
          # decision: keeps the selected config at the repo root because exec commands resolve relative to the config
          cp build/codspeed/selected.yml .codspeed-selected.yml

      - name: Check benchmark results
        run: |
          if [ "$BENCH_PROFILE" = throughput ]; then
            node build/codspeed/js-throughput/bench.mjs --smoke
            exit 0
          fi
          targets=(dotnet js python beam)
          if [ "$BENCH_TARGET" != all ]; then targets=("$BENCH_TARGET"); fi
          for target in "${targets[@]}"; do
            bash benchmarks/cli/run.sh "$target" --smoke
          done

      - name: Measure and report benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: walltime
          config: .codspeed-selected.yml
