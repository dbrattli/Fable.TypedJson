name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x
          cache: true
          cache-dependency-path: 'paket.lock'

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Restore dependencies
        run: just restore-net

      - name: Type check (.NET build)
        run: just check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [beam, python, js, dotnet]

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x
          cache: true
          cache-dependency-path: 'paket.lock'

      - name: Setup Erlang/OTP
        if: matrix.target == 'beam'
        uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          rebar3-version: '3'

      - name: Setup uv (Python)
        if: matrix.target == 'python'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: 'uv.lock'

      - name: Setup Node.js
        if: matrix.target == 'js'
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Cache rebar3 dependencies
        if: matrix.target == 'beam'
        uses: actions/cache@v5
        with:
          path: ~/.cache/rebar3
          key: rebar3-${{ hashFiles('**/rebar.config') }}
          restore-keys: rebar3-

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Restore dependencies
        run: just ${{ matrix.target == 'python' && 'restore' || 'restore-net' }}

      - name: Test
        run: just test-${{ matrix.target }}
